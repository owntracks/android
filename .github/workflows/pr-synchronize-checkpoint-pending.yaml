---
# When a new commit is pushed to an already-open PR, the real test suite (build-test-lint.yaml) is
# NOT re-run automatically — that's deliberately comment-gated (see pull-request-comment.yaml) to
# avoid burning CI minutes, and Espresso emulator time in particular, on every fixup commit during
# active PR iteration.
#
# Without this workflow, that means a new commit's SHA has no "PR Checkpoint Status" posted for it
# at all until someone remembers to comment /run-tests, which can silently let an unvalidated commit
# sit mergeable (or only blockable via an admin's manual judgement) rather than visibly blocked.
#
# This posts an in-progress check for the new SHA instead, so the PR is not mergeable until it is
# explicitly re-validated. It uses the same Checks API (LouisBrunner/checks-action) as
# pull-request-comment.yaml rather than the Commit Status API: GitHub's required-status-check
# matching does not dedupe a Checks API run against a Commit Status API entry of the same name, so
# mixing the two left an unresolvable "PR Checkpoint Status: pending" commit status sitting
# alongside the real, later "success" check run and permanently blocking merge. Keeping both on the
# Checks API means the later run (from /run-tests) is simply the more recent check with this name.
name: PR Synchronized (Pending Checkpoint)

"on":
  pull_request:
    types: [synchronize]
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "project/app/src/**"
      - "project/app/*.pro"
      - "project/buildSrc/src/**"
      - "project/*.gradle.kts"
      - "project/app/*.gradle.kts"
      - "project/gradle.properties"
      - "project/gradle/wrapper/gradle-wrapper.properties"
      - "project/gradle/libs.versions.toml"

jobs:
  mark-pending:
    name: "Mark PR Checkpoint Status pending"
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Set pending check
        uses: LouisBrunner/checks-action@v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PR Checkpoint Status
          sha: ${{ github.event.pull_request.head.sha }}
          status: in_progress
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title":"Awaiting validation", "summary":"New commits pushed — comment /run-tests to validate before merging", "text":"New commits pushed — comment /run-tests to validate before merging"}
